name: Android Build

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: '构建通过后自动发布 Release（tag 取 package.json 的 version）'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 隐私检查（阻断项命中即停止）
        run: node scripts/privacy-check.mjs

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3

      - name: 读取版本号
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT
          echo "本次构建：$VERSION"

      - name: 安装 Android SDK 组件
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;35.0.0" "ndk;26.1.10909125"

      - name: 安装依赖
        run: |
          npm ci --no-audit --no-fund
          if [ -f dependencies-patch.js ]; then node dependencies-patch.js; fi

      - name: 写入签名文件
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "缺少 secret: ANDROID_KEYSTORE_BASE64（见 README 说明）"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/lxmod.keystore
          {
            echo "storeFile=lxmod.keystore"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/keystore.properties

      - name: 构建 arm64 release
        run: cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: 生成版本清单
        run: node scripts/gen-release-json.js

      - name: 校验产物
        run: |
          ls -lh android/app/build/outputs/apk/*/release/*.apk
          cat release/version.json

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.ver.outputs.version }}-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/**/release/*.apk
            release/version.json
          retention-days: 30
          if-no-files-found: error

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            android/app/build/outputs/apk/**/release/*.apk
            release/version.json

      - name: 同步清单回 main（jsDelivr 镜像用）
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/version.json
          if git diff --cached --quiet; then
            echo "清单无变化，跳过"
            exit 0
          fi
          git commit -m "chore: 同步更新清单到 ${{ steps.ver.outputs.tag }}"
          git push origin HEAD:main

      - name: 刷新 jsDelivr 缓存
        if: startsWith(github.ref, 'refs/tags/') || inputs.release
        continue-on-error: true
        run: |
          # jsDelivr 对 @main 会缓存很久，不主动刷的话备用源会一直吐旧清单
          curl -sf --max-time 30 "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/release/version.json" > /dev/null \
            || echo "purge 失败（不影响发布，CDN 到期后会自更新）"
